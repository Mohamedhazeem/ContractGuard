# ContractGuard native Hermes plugin manifest.
#
# Hermes loads this directory as `hermes_plugins.<slug>` and calls the
# `register(ctx)` function in the adjacent `__init__.py`.
#
# IMPORTANT: `provides_tools` and `provides_hooks` must list every tool and hook
# that `register(ctx)` actually registers. `hermes plugins validate` fails the
# manifest-parity check when they drift apart, and the catalog entry repeats
# this list under `capabilities:`.
name: contractguard
version: "0.2.0"
description: "Hermes-native OpenAPI request preflight, live response verification, and contract drift evidence"
license: MIT
author: "ContractGuard contributors"
homepage: "https://github.com/Mohamedhazeem/ContractGuard"
tags:
  - openapi
  - api-contracts
  - contract-testing
  - developer-tools
  - quality

# Truthful compatibility floor: the plugin uses `ctx.register_tool`,
# `ctx.register_hook`, the `pre_verify` hook, and `plugins.plugin_storage`'s
# `plugin_db`/`plugin_data_dir`. The pre_verify hook and the plugin-storage
# helpers are both present from Hermes 0.21.6 onward, and the manifest's own
# `requires_hermes` field is honoured from that release on.
requires_hermes: ">=0.21.6"

provides_tools:
  - contractguard_ping
  - contractguard_inspect
  - contractguard_register
  - contractguard_validate_request
  - contractguard_test
  - contractguard_diff
  - contractguard_history
  - contractguard_promote_baseline
provides_hooks:
  - pre_tool_call
  - pre_verify
