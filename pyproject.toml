[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "contractguard"
version = "0.1.0"
description = "Hermes-native OpenAPI request preflight, live response verification, and contract drift evidence"
readme = "README.md"
# Caret-style "^3.10" expressed per PEP 440: 3.10 or newer, below 4.0.
requires-python = ">=3.10,<4.0"
authors = [{ name = "ContractGuard contributors" }]
license = { text = "MIT" }
keywords = [
  "api-contracts",
  "contract-testing",
  "hermes",
  "hermes-agent",
  "openapi",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  # Runtime validation for OpenAPI 3.0/3.1/3.2 request and response payloads.
  "openapi-core>=0.19,<0.20",
  # Independent structural document validation and diagnostics.
  "openapi-spec-validator>=0.7,<0.8",
  # Bounded HTTP transport for live GET/HEAD verification.
  "httpx>=0.27,<0.29",
  # Safe YAML parsing (always yaml.safe_load, never yaml.load).
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12",
]
demo = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.entry-points."hermes_agent.plugins"]
# Enables a pip-installed distribution to be discovered by Hermes. The native
# directory plugin still loads through the root __init__.py.
contractguard = "contractguard:register"

[tool.hatch.build.targets.wheel]
packages = ["src/contractguard"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: exercises adapters against local fixtures or a running demo API",
  "network: requires a live loopback HTTP target",
]

[tool.coverage.run]
branch = true
source = ["src/contractguard"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PT", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# The repository root is named "ContractGuard" (project name), but the plugin
# entry file must remain at the directory root for Hermes. Module-name linting
# applies to the importable package under src/, not this bootstrap file.
"__init__.py" = ["N999"]
"tests/**" = ["PT011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
show_error_codes = true
pretty = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["openapi_core.*", "httpx.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Hermes is the host runtime, not a package dependency. Adapters import its
# documented storage helpers lazily; tests and standalone analysis may not have
# the Hermes source tree on their path.
module = ["plugins.*"]
ignore_missing_imports = true
